name: Security audit offline tests
on:
  pull_request:
    paths:
      - 'Invoke-SqlSecurityAudit.ps1'
      - 'Compare-SqlSecurityAudit.ps1'
      - 'modules/SecurityAudit.psm1'
      - 'modules/AuditExcel.psm1'
      - 'tests/Test-SqlSecurityAudit.ps1'
      - '.github/workflows/security-audit-offline.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-offline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit parser, XLSX and synthetic reconciliation
        shell: powershell
        run: .\tests\Test-SqlSecurityAudit.ps1
      - name: Existing migration offline unit tests
        shell: powershell
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Existing Windows smoke test
        shell: powershell
        run: .\tests\SmokeTest.ps1
